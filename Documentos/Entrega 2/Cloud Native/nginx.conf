# =============================================================================
# nginx/nginx.conf
# Configuração principal do Nginx como reverse proxy da API REST
# =============================================================================

user  nginx;
worker_processes  auto;           # Um worker por CPU

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;                    # Melhor performance no Linux
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ── Logging estruturado (JSON) ────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # Limita requisições por IP: 10 req/s com burst de 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css;

    # ── Headers de segurança ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    server_tokens off;   # Oculta versão do Nginx

    # ── Upstream: API REST ────────────────────────────────────────────────────
    upstream api_backend {
        server api:8080;
        keepalive 32;             # Conexões persistentes para performance
    }

    # ── Virtual host principal ────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
