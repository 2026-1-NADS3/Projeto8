# =============================================================================
# postgres/postgresql.conf
# Configurações de performance e segurança para ambiente de desenvolvimento
# Ajuste os valores conforme a memória disponível no servidor.
#
# Regra geral para shared_buffers: 25% da RAM total
# Regra geral para effective_cache_size: 75% da RAM total
# =============================================================================

# ── Conexões ──────────────────────────────────────────────────────────────────
max_connections            = 100
superuser_reserved_connections = 3

# ── Memória ───────────────────────────────────────────────────────────────────
# Para servidor com 2 GB de RAM:
shared_buffers             = 512MB      # 25% da RAM
effective_cache_size       = 1536MB     # 75% da RAM
work_mem                   = 16MB       # por operação de sort/hash
maintenance_work_mem       = 128MB      # para VACUUM, CREATE INDEX

# ── Checkpoints ───────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
wal_buffers                = 16MB
max_wal_size               = 1GB
min_wal_size               = 80MB

# ── Planner ───────────────────────────────────────────────────────────────────
random_page_cost           = 1.1       # SSDs (use 4.0 para HDD)
effective_io_concurrency   = 200       # SSDs

# ── Paralelismo ───────────────────────────────────────────────────────────────
max_parallel_workers_per_gather = 2
max_parallel_workers       = 4
max_worker_processes       = 8

# ── Logging ───────────────────────────────────────────────────────────────────
log_destination            = 'stderr'
logging_collector          = off        # Docker captura stderr diretamente
log_timezone               = 'America/Sao_Paulo'
log_min_duration_statement = 1000       # Loga queries acima de 1 segundo
log_line_prefix            = '%t [%p] %u@%d '
log_lock_waits             = on
log_temp_files             = 0

# ── Estatísticas ──────────────────────────────────────────────────────────────
track_activities           = on
track_counts               = on
track_io_timing            = on
track_functions            = all

# ── Extensões pré-carregadas ──────────────────────────────────────────────────
shared_preload_libraries   = 'pg_stat_statements'
pg_stat_statements.track   = all

# ── Locale e encoding ─────────────────────────────────────────────────────────
datestyle                  = 'iso, dmy'
timezone                   = 'America/Sao_Paulo'
lc_messages                = 'en_US.utf8'
lc_monetary                = 'pt_BR.UTF-8'
lc_numeric                 = 'pt_BR.UTF-8'
lc_time                    = 'pt_BR.UTF-8'
default_text_search_config = 'pg_catalog.portuguese'
