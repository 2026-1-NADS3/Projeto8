# =============================================================================
# nginx/conf.d/api.conf
# Virtual host da API REST — HTTP (porta 80)
# Em produção, adicione bloco server para HTTPS na porta 443
# =============================================================================

server {
    listen 80;
    server_name _;          # Aceita qualquer hostname (ajuste em produção)

    # ── Health check do Nginx (usado pelo Docker healthcheck) ─────────────────
    location /nginx-health {
        access_log off;
        return 200 '{"status":"UP","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── API REST — proxy reverso ──────────────────────────────────────────────
    location /api/ {
        # Rate limiting: 10 req/s, burst de 20 sem delay
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # Proxy para o container da API (nome Docker DNS: "api")
        proxy_pass         http://api_backend/;
        proxy_http_version 1.1;

        # Headers para o backend identificar o cliente real
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # ── Actuator (monitoramento Spring Boot) ──────────────────────────────────
    # Exposto externamente apenas o /health; demais endpoints internos
    location /actuator/health {
        proxy_pass http://api_backend/actuator/health;
        access_log off;
    }

    location /actuator/ {
        # Restringe acesso ao actuator completo por IP
        allow  172.20.0.0/24;   # Rede interna Docker
        allow  127.0.0.1;
        deny   all;
        proxy_pass http://api_backend/actuator/;
    }

    # ── Bloqueia arquivos sensíveis ───────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
