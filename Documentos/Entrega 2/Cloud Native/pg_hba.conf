# =============================================================================
# postgres/pg_hba.conf
# Host-Based Authentication — controla QUEM pode conectar e COMO
#
# Formato: TYPE  DATABASE  USER  ADDRESS  METHOD
#
# Métodos de autenticação:
#   trust  : aceita sem senha (NUNCA use em produção)
#   md5    : senha hash MD5 (compatível, mas menos seguro que scram)
#   scram-sha-256 : método moderno recomendado (PostgreSQL 14+)
#   reject : rejeita explicitamente a conexão
# =============================================================================

# ── Conexões locais (dentro do container) ─────────────────────────────────────
# O usuário postgres (superusuário do sistema) usa peer auth localmente
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# ── Conexões TCP/IP (entre containers na mesma rede Docker) ───────────────────
# IPv4 — rede interna Docker (172.20.0.0/24 definida no docker-compose.yml)
host    all             all             172.20.0.0/24           scram-sha-256

# ── Conexões TCP/IP — loopback (para health checks internos) ─────────────────
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# ── Replicação (para futuro setup de réplicas) ────────────────────────────────
# host    replication     replicator      172.20.0.0/24           scram-sha-256

# ── Segurança: rejeita qualquer outra origem ──────────────────────────────────
# Descomente em produção para bloquear conexões não previstas:
# host    all             all             0.0.0.0/0               reject
